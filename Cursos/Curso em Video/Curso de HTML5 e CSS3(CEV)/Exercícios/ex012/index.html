<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working with vids</title>
</head>
<body>
    <h1>Vídeos hospedados localemnte</h1>
    <p>Esse vídeo está hospedado no meu próprio servidor</p>
    <video width="750" poster="imagens/thumb.jpg" controls autoplay loop>
        <source src="midia/meu-video.mkv" type="video/mkv">
        <source src="midia/meu-video.webm" type="video/webm">
        <source src="midia/meu-video.ogv" type="video/ogg">
        <source src="midia/meu-video.mp4" type="video/mp4">
        <p>Infelizmente seu navegador não tem compatibilidade com a reprodução de vídeos :(</p>
    </video>
    <h1>Inserindo Vídeos Externos</h1>
    <iframe width="750" height="315" src="https://www.youtube.com/embed/PHgc8Q6qTjc?si=5n7aY35X2O8qj2Mz" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
